<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Says</h1>
    <h3>Press Any Key to Start</h3>
    
    <details>
        <summary>Game Rules</summary>
        <p>1. Watch the flashing sequence carefully.</p>
        <p>2. Repeat the sequence by clicking buttons.</p>
        <p>3. Sequence increases every level.</p>
        <p>4. Wrong click = Game Over.</p>
    </details>
      
    <div class="box">
        <div class="line1">
            <div class="red btn" id="red"></div>
            <div class="aqua btn" id="aqua"></div>
        </div>
        <div class="line2">
            <div class="blue btn" id="blue"></div>
            <div class="gold btn" id="gold"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
